[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

# NOTE: the requested distribution name `uni-rl` is unregistrable on both PyPI and
# TestPyPI (ultranormalized collision with the existing `unirl` project).
# Distribution name is therefore `unilab-rl`; the import namespace stays `uni_rl`.
[project]
name = "unilab-rl"
version = "0.1.0a1"
description = "Reinforcement learning algorithms and async runtimes extracted from UniLab (PPO/APPO/SAC/TD3/FlashSAC/HIM-PPO/HORA)"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "UniLab contributors" }]
keywords = ["reinforcement-learning", "robotics", "gpu-simulation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "numpy",
    "torch>=2.7.0",
    "tensordict",
    "omegaconf",
    "hydra-core",
    "rsl-rl-lib>=5.0.0",
    "tensorboard",
    "wandb>=0.22.3",
    "packaging",
    "rich",
]

[project.urls]
Repository = "https://github.com/unilabsim/uni_rl"

[tool.uv.build-backend]
module-name = "uni_rl"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
    "mypy",
    # TEMPORARY (issue #1479): editable path dependency on UniLab so migrated
    # modules can keep importing unilab.base.* / unilab.utils.{sim2sim,checkpoint}
    # until the decoupling lands. Remove together with every
    # TODO(issue-1479) import marker.
    "unilab",
]

[tool.uv.sources]
# TEMPORARY (issue #1479): local UniLab checkout for the dev dependency above.
unilab = { path = "../UniLab", editable = true }
# TEMPORARY (issue #1479): unilab pins torch==2.8.0 from these indexes.
torch = [
    { index = "r2-cu130", marker = "sys_platform=='linux' and platform_machine=='aarch64'" },
    { index = "pytorch-cu128", marker = "sys_platform=='linux' and platform_machine=='x86_64'" },
    { index = "pytorch-cu128", marker = "sys_platform=='win32'" },
]

# TEMPORARY (issue #1479): the unilab dev dependency pins torch==2.8.0 via
# these indexes; mirroring them here keeps resolution consistent and reuses
# the shared uv cache. Drop together with the unilab dev dependency.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "r2-cu130"
url = "https://download-r2.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = [
    "E501",
    "N806",
    "E402",
    "F401",
    "N801",
    "F821",
    "E741",
    "N802",
    "N803",
    "N812",
]

[tool.mypy]
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running training or smoke tests",
]
addopts = "--tb=short -m 'not slow'"
